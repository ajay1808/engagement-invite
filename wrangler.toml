# Cloudflare Pages settings for shreya-ajay.pages.dev.
# The engagement invite is plain static files and doesn't use any of this;
# only the save-the-date reply form (save-the-date/ + functions/) does.
name = "shreya-ajay"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

# Where save-the-date replies are stored (Cloudflare D1, a SQLite database).
[[d1_databases]]
binding = "DB"
database_name = "shreya-ajay-rsvp"
database_id = "09c35f9c-6418-4930-bf5e-193e16ff9b51"
migrations_dir = "migrations"

[vars]
# Cloudflare Turnstile (spam check). Leave empty to turn it off.
# The matching secret is set separately: TURNSTILE_SECRET.
TURNSTILE_SITE_KEY = ""
