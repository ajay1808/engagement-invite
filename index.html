<script>
  document.documentElement.classList.add('js');
  // If a file is missing, try the next name in data-fallback (e.g. 3.jpg → 3.JPG → 3.png …)
  function nextSrc(img) {
    var list = (img.dataset.fallback || '').split(/\s+/).filter(Boolean);
    if (!list.length) { if ('optional' in img.dataset) img.hidden = true; return; }
    img.dataset.fallback = list.slice(1).join(' ');
    img.src = list[0];
  }
</script>

<style>
  :root {
    --maroon-900: #170404;
    --maroon-800: #2a0707;
    --maroon-700: #4a0e0e;
    --gold: #e3c27e;
    --gold-soft: rgba(227, 194, 126, .34);
    --ivory: #f8eedc;
    --side: 10px;
    --pad-top: 44px;
    --pad-bottom: 104px;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    color-scheme: dark;
  }
  /* Wide screens (desktop, landscape tablets): room at the sides for the page dots */
  @media (min-aspect-ratio: 19/20) {
    :root { --side: 80px; --pad-top: 30px; --pad-bottom: 70px; }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--maroon-900); color: var(--ivory); }
  body {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, a { touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ───── Scrolling deck ───── */
  .deck {
    position: relative;
    height: 100vh;
    height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: none;
    scrollbar-width: none;
    outline: none;
  }
  .deck::-webkit-scrollbar { display: none; }

  .slide {
    position: relative;
    height: 100%;
    overflow: hidden;
    overflow: clip;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding:
      calc(var(--pad-top) + env(safe-area-inset-top)) var(--side)
      calc(var(--pad-bottom) + env(safe-area-inset-bottom));
  }

  /* Soft, blurred copy of the page's own artwork fills the space around it */
  .ambient {
    position: absolute;
    inset: -12%;
    z-index: 0;
    background-color: var(--maroon-800);
    background-image: var(--bg, none);
    background-position: center;
    background-size: cover;
    filter: blur(38px) saturate(1.3) brightness(.68);
  }
  .slide::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(120% 85% at 50% 45%, transparent 30%, rgba(18, 3, 3, .6) 100%);
  }

  /* The framed artwork: the picture sits exactly inside the border's main line, and the
     border's knots extend just past it. --far is set from the picture's real size, so any
     replacement fits. */
  .frame {
    --far: .803;
    --extra: 0px;
    position: relative;
    z-index: 2;
    flex: none;
    margin: 0;
    aspect-ratio: var(--far);
    width: min(100%, calc((100vh - var(--pad-top) - var(--pad-bottom) - var(--extra)) * var(--far)));
    width: min(100%, calc((100dvh - var(--pad-top) - var(--pad-bottom) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - var(--extra)) * var(--far)));
  }
  .slide.has-actions .frame { --extra: 64px; }
  .slide.has-save .frame { --extra: 40px; }
  .slide.has-save.has-actions .frame { --extra: 100px; }
  .slide.has-save.has-actions.has-credit .frame { --extra: 116px; }
  .media {
    position: absolute;
    /* where the border's main line runs, as a share of border.png's size */
    left: 4.3944%;
    right: 4.5746%;
    top: 4.3332%;
    bottom: 4.3237%;
    overflow: hidden;
    overflow: clip;
    background: var(--maroon-800);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .85), 0 14px 32px -14px rgba(0, 0, 0, .6);
    transform: translateZ(0);
  }
  .media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Decorative border drawn over every painting (stays put when a painting is replaced) */
  .frame .border {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .slide.cover .media .art {
    transform-origin: 50% 62%;
    animation: drift 22s ease-in-out infinite alternate;
  }

  /* Entrance: each page rises in the first time it's seen */
  .js .frame { opacity: 0; transform: translateY(28px) scale(.98); transition: opacity 1.1s ease, transform 1.4s var(--ease-out); }
  .js .slide.seen .frame { opacity: 1; transform: none; }

  /* ───── Optional buttons under the last page ───── */
  .actions {
    position: relative;
    z-index: 2;
    flex: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .js .actions { opacity: 0; transform: translateY(12px); transition: opacity .9s ease .35s, transform 1s var(--ease-out) .35s; }
  .js .slide.seen .actions { opacity: 1; transform: none; }
  .actions a, .actions button {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 46px;
    padding: 0 22px 0 18px;
    border-radius: 99px;
    border: 1px solid rgba(227, 194, 126, .55);
    background: rgba(28, 5, 5, .42);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: var(--ivory);
    text-decoration: none;
    font: 600 15px/1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .1em;
    text-transform: uppercase;
    transition: background .3s, border-color .3s, transform .2s;
    cursor: pointer;
  }
  .actions .soon { opacity: .6; cursor: default; }
  .actions a:hover { background: rgba(227, 194, 126, .16); border-color: var(--gold); }
  .actions a:active { transform: scale(.97); }
  .toast {
    position: fixed;
    z-index: 6;
    left: 50%;
    bottom: calc(64px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    padding: 11px 20px;
    border-radius: 99px;
    border: 1px solid rgba(227, 194, 126, .4);
    background: rgba(28, 5, 5, .78);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: var(--ivory);
    font: italic 500 18px/1.2 'Cormorant Garamond', Georgia, serif;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .5s var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .actions svg { width: 17px; height: 17px; color: var(--gold); flex: none; }

  /* "Save invite as PDF" link under the buttons */
  .save-pdf {
    position: relative;
    z-index: 2;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: -6px;
    padding: 6px 10px;
    color: rgba(248, 238, 220, .88);
    text-decoration: none;
    font: italic 500 17px/1.2 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .02em;
  }
  .save-pdf svg { width: 16px; height: 16px; color: var(--gold); flex: none; }
  .save-pdf span { border-bottom: 1px solid rgba(227, 194, 126, .45); padding-bottom: 1px; transition: border-color .3s; }
  .save-pdf:hover span { border-color: var(--gold); }
  .js .save-pdf { opacity: 0; transition: opacity .9s ease .55s; }
  .js .slide.seen .save-pdf { opacity: 1; }

  /* Music credit, under "Save invite as PDF" */
  .credit {
    position: relative;
    z-index: 2;
    flex: none;
    margin-top: -14px;
    font: italic 500 13px/1.3 'Cormorant Garamond', Georgia, serif;
    color: rgba(248, 238, 220, .55);
    text-decoration: none;
  }
  .credit:hover { color: rgba(248, 238, 220, .85); }
  .js .credit { opacity: 0; transition: opacity .9s ease .7s; }
  .js .slide.seen .credit { opacity: 1; }

  /* ───── Music on/off, top right ───── */
  .sound {
    position: fixed;
    z-index: 6;
    top: calc(14px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid rgba(227, 194, 126, .45);
    background: rgba(28, 5, 5, .45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--gold);
    cursor: pointer;
    transition: border-color .3s, transform .2s;
  }
  .sound:hover { border-color: var(--gold); }
  .sound:active { transform: scale(.94); }
  .sound svg { grid-area: 1 / 1; width: 21px; height: 21px; }
  .sound .on, .sound[aria-pressed="true"] .off { display: none; }
  .sound[aria-pressed="true"] .on { display: block; }
  /* a soft ring invites the first tap, until the music has played once */
  .sound.invite::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    pointer-events: none;
    animation: ring 2.4s ease-out infinite;
  }
  @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }

  /* ───── Falling petals (between the blurred backdrop and the artwork) ───── */
  .petals {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  .petals.on { opacity: 1; }

  /* ───── Page dots + scroll hint ───── */
  .dots {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
  }
  .dots button {
    appearance: none;
    border: 0;
    background: none;
    padding: 10px 5px;
    cursor: pointer;
  }
  .dots button::before {
    content: "";
    display: block;
    width: 7px;
    height: 7px;
    border-radius: 99px;
    background: rgba(248, 238, 220, .4);
    transition: width .5s var(--ease-out), height .5s var(--ease-out), background .5s;
  }
  .dots button:hover::before { background: rgba(248, 238, 220, .75); }
  .dots button[aria-current="true"]::before { width: 24px; background: var(--gold); }

  .hint {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(52px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 14px 6px calc(14px + .34em);
    border: 0;
    background: none;
    color: var(--ivory);
    font: 600 12px/1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .34em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: .9;
    transition: opacity .6s ease, transform .6s var(--ease-out);
  }
  .hint svg { width: 18px; height: 18px; color: var(--gold); animation: nudge 2.2s ease-in-out infinite; }
  .hint.away { opacity: 0; pointer-events: none; transform: translate(-50%, 8px); }

  @media (min-aspect-ratio: 19/20) {
    .dots {
      left: auto;
      right: calc(28px + env(safe-area-inset-right));
      top: 50%;
      bottom: auto;
      transform: translateY(-50%);
      flex-direction: column;
    }
    .dots button { padding: 5px 10px; }
    .dots button[aria-current="true"]::before { width: 7px; height: 24px; }
    .hint { bottom: calc(12px + env(safe-area-inset-bottom)); }
  }

  /* ───── Opening page ("You're invited") ───── */
  .slide.intro {
    background: radial-gradient(120% 90% at 50% 42%, var(--maroon-700) 0%, var(--maroon-800) 55%, var(--maroon-900) 100%);
    cursor: pointer;
  }
  .intro-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .logo {
    display: block;
    width: min(64vw, 280px);
    height: auto;
    max-height: 42vh;
    object-fit: contain;
    opacity: 0;
    transform: scale(.94);
    transition: opacity 1.2s ease, transform 1.6s var(--ease-out);
    user-select: none;
    -webkit-user-select: none;
  }
  .logo.in { opacity: 1; transform: none; }
  .intro-title {
    margin: 0;
    font: italic 500 32px/1.1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .02em;
    opacity: 0;
    animation: rise 1.1s var(--ease-out) .9s forwards;
  }
  .intro-line {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: grow 1.3s var(--ease-out) 1.15s forwards;
  }

  @keyframes grow { to { width: 132px; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes nudge { 0%, 100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(5px); opacity: 1; } }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .25s !important; }
    .slide.cover .media .art { animation: none; }
    .js .frame, .js .actions { transform: none; }
  }
</style>
</head>
<body>

<main class="deck" id="deck" tabindex="-1">

  <!-- Opening page -->
  <section class="slide intro" aria-label="Invitation, page 1 of 4">
    <div class="intro-inner">
      <!-- Logo: replace logo.png to change it -->
      <img class="logo" src="logo.png" data-fallback="Logo.PNG Logo.png logo.PNG logo.jpg logo.jpeg logo.webp" data-optional
           onerror="nextSrc(this)" alt="Monogram" fetchpriority="high" draggable="false">
      <h1 class="intro-title">You're invited</h1>
      <span class="intro-line"></span>
    </div>
  </section>

  <!-- Page 1 (blessings) -->
  <section class="slide cover" aria-label="Invitation, page 2 of 4">
    <div class="ambient" style="--bg:url('1.jpg')"></div>
    <figure class="frame">
      <div class="media">
        <img class="art" src="1.jpg" data-fallback="1.JPG 1.jpeg 1.png 1.PNG" onerror="nextSrc(this)"
             alt="Sri Rama Jayam. With the blessings of our families, Sujatha &amp; Rangaraj and Deepa Kasturirangan warmly invite you to celebrate a beautiful new beginning with us."
             draggable="false">
      </div>
      <img class="border" src="border.png" alt="" aria-hidden="true" draggable="false">
    </figure>
  </section>

  <!-- Page 2 (Nichayathartham, names) -->
  <section class="slide" aria-label="Invitation, page 3 of 4">
    <div class="ambient" style="--bg:url('2.jpg')"></div>
    <figure class="frame">
      <div class="media">
        <img class="art" src="2.jpg" data-fallback="2.JPG 2.jpeg 2.png 2.PNG" onerror="nextSrc(this)"
             alt="Nichayathartham. Shreya &amp; Ajay."
             draggable="false">
      </div>
      <img class="border" src="border.png" alt="" aria-hidden="true" draggable="false">
    </figure>
  </section>

  <!-- Page 3 (date, time and venue) -->
  <section class="slide has-save" aria-label="Invitation, page 4 of 4">
    <div class="ambient"></div>
    <figure class="frame">
      <div class="media">
        <img class="art" src="3.jpg" data-fallback="3.JPG 3.jpeg 3.png 3.PNG 3.webp" onerror="nextSrc(this)"
             alt="Join us in celebrating this beautiful beginning, and bless the journey ahead. Sunday, 13th December 2026, 8:00 AM onwards. Sai Villa, Neelankarai, Chennai. Followed by lunch." fetchpriority="low" draggable="false">
      </div>
      <img class="border" src="border.png" alt="" aria-hidden="true" draggable="false">
    </figure>
    <div class="actions" hidden></div>
    <!-- Offline copy: all pages plus the full address. Rebuild with pdf-build/make_pdf after changing pictures. -->
    <a class="save-pdf" href="invite.pdf" download="Shreya-Ajay-Nichayathartham.pdf" type="application/pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span>Save invite as PDF</span>
    </a>
    <a class="credit" target="_blank" rel="noopener" hidden></a>
  </section>

</main>

<canvas class="petals" aria-hidden="true"></canvas>

<nav class="dots" aria-label="Pages">
  <button type="button" aria-label="Page 1" aria-current="true"></button>
  <button type="button" aria-label="Page 2"></button>
  <button type="button" aria-label="Page 3"></button>
  <button type="button" aria-label="Page 4"></button>
</nav>

<!-- Music on/off -->
<audio id="music" preload="none"></audio>
<button class="sound" type="button" aria-label="Play music" aria-pressed="false" hidden>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5H7L11.5 6v12L7 14.5H3.5z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5H7L11.5 6v12L7 14.5H3.5z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.8 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
</button>

<button class="hint away" type="button" aria-label="Next page">
  Scroll
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>

<script>
/* ─────────────────────────────────────────────────────────────
   Buttons shown under the last page.
   A button with an empty url shows as a dimmed "coming soon" placeholder.
   Delete a line to remove that button completely.
   ───────────────────────────────────────────────────────────── */
const BUTTONS = [
  { label: 'Directions', icon: 'pin',   url: 'https://maps.app.goo.gl/g7oSCpVAiHDaX7pBA' },
  { label: 'RSVP',       icon: 'check', url: 'https://forms.gle/tU1bEZkjQRunACQm6' },
];

/* Background music: put the audio file in this folder as music.mp3 to switch it on.
   Until the file exists, the speaker button and the credit line stay hidden. */
const MUSIC = {
  src: 'music.mp3',
  start: 8,          // seconds into the track to begin (and to loop back to)
  credit: 'Music: “Bhakthinamam” by Bank Of Sounds NCS',
  creditUrl: 'https://youtu.be/s0z1l1u3zBI',
};

(() => {
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll('.slide')];
  const dots = [...document.querySelectorAll('.dots button')];
  const hint = document.querySelector('.hint');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current = 0;
  let ready = false;

  /* Fit each frame to the real shape of its image, and use it for the blurred backdrop.
     1.00343 accounts for the border's knots extending slightly more at the sides than top/bottom. */
  const fit = img => {
    if (!img.naturalWidth) return;
    img.closest('.frame').style.setProperty('--far', img.naturalWidth / img.naturalHeight * 1.00343);
    const src = (img.currentSrc || img.src).replace(/'/g, '%27');
    img.closest('.slide').querySelector('.ambient').style.setProperty('--bg', `url('${src}')`);
  };
  document.querySelectorAll('.media .art').forEach(img => {
    if (img.complete) fit(img);
    img.addEventListener('load', () => fit(img));
  });

  /* Optional buttons */
  const ICONS = {
    pin:  '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    chat: '<path d="M4 19.5l1.3-3.9A8 8 0 1 1 8.4 18.7z"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.8 2.8L16.2 9.8"/>',
    link: '<path d="M7 17L17 7M9 7h8v8"/>',
  };
  const actions = document.querySelector('.actions');
  let toastTimer = 0;
  const toast = msg => {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      t.setAttribute('role', 'status');
      document.body.append(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  };
  BUTTONS.forEach(b => {
    let a;
    if (b.url) {
      a = document.createElement('a');
      a.href = b.url;
      a.target = '_blank';
      a.rel = 'noopener';
    } else {
      a = document.createElement('button');
      a.type = 'button';
      a.className = 'soon';
      a.setAttribute('aria-disabled', 'true');
      a.addEventListener('click', () => toast(`${b.label} link coming soon`));
    }
    a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[b.icon] || ICONS.link}</svg>`;
    a.append(b.label);
    actions.append(a);
  });
  if (actions.children.length) {
    actions.hidden = false;
    actions.closest('.slide').classList.add('has-actions');
  }

  /* Page tracking */
  const setActive = i => {
    current = i;
    dots.forEach((d, j) => d.setAttribute('aria-current', j === i ? 'true' : 'false'));
    hint.classList.toggle('away', i === slides.length - 1);
    slides[i].classList.add('seen');
  };
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const i = slides.indexOf(e.target);
      if (e.isIntersecting && e.intersectionRatio >= .6 && ready && i !== current) setActive(i);
    });
  }, { root: deck, threshold: .6 });
  slides.forEach(s => io.observe(s));

  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    deck.scrollTo({ top: slides[i].offsetTop, behavior: reduced ? 'auto' : 'smooth' });
  }
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  hint.addEventListener('click', () => go(current + 1));

  /* Mouse wheel / trackpad: one gesture = one page (touch scrolling stays native) */
  let wheelLock = false, wheelTimer = 0;
  deck.addEventListener('wheel', e => {
    if (e.ctrlKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { wheelLock = false; }, 200);
    if (wheelLock || !ready) return;
    wheelLock = true;
    go(current + Math.sign(e.deltaY));
  }, { passive: false });
  addEventListener('keydown', e => {
    if (!ready || e.altKey || e.ctrlKey || e.metaKey) return;
    const onButton = e.target.closest && e.target.closest('button, a');
    if (['ArrowDown', 'PageDown', 'j'].includes(e.key) || (e.key === ' ' && !onButton && !e.shiftKey)) go(current + 1);
    else if (['ArrowUp', 'PageUp', 'k'].includes(e.key) || (e.key === ' ' && !onButton && e.shiftKey)) go(current - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(slides.length - 1);
    else return;
    e.preventDefault();
  });

  /* Music: browsers only allow sound after the guest interacts, so it starts on their first tap
     (unless they turned it off before). The speaker button toggles it. */
  const music = document.getElementById('music');
  const soundBtn = document.querySelector('.sound');
  let wantMusic = true;
  try { wantMusic = localStorage.getItem('invite-music') !== 'off'; } catch (e) {}
  let fadeTimer = 0;
  const setPlaying = on => {
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', on ? 'Turn music off' : 'Play music');
    if (on) soundBtn.classList.remove('invite');
  };
  const playMusic = () => {
    clearInterval(fadeTimer);
    music.volume = 0;
    const p = music.play();
    if (!p) return;
    p.then(() => {
      setPlaying(true);
      fadeTimer = setInterval(() => {                    // gentle fade-in (iPhones ignore volume, which is fine)
        music.volume = Math.min(0.7, music.volume + 0.05);
        if (music.volume >= 0.7) clearInterval(fadeTimer);
      }, 120);
    }).catch(() => setPlaying(false));
  };
  const onFirstTap = e => {
    if (e.target.closest && e.target.closest('.sound')) return;
    if (!wantMusic || !music.paused) return;
    playMusic();
  };
  const firstTapEvents = ['click', 'touchend', 'keydown'];
  music.addEventListener('playing', () => firstTapEvents.forEach(t => document.removeEventListener(t, onFirstTap, true)), { once: true });
  // begin at the chosen start point (the #t= in the file link isn't honoured everywhere)
  const toStart = () => { if (music.currentTime < MUSIC.start - 0.5) music.currentTime = MUSIC.start; };
  music.addEventListener('loadedmetadata', toStart);
  music.addEventListener('playing', toStart, { once: true });
  // loop back to the chosen start point rather than the very beginning
  music.addEventListener('ended', () => {
    music.currentTime = MUSIC.start;
    music.play().catch(() => setPlaying(false));
  });
  soundBtn.addEventListener('click', () => {
    wantMusic = music.paused;
    if (wantMusic) playMusic(); else { music.pause(); setPlaying(false); }
    try { localStorage.setItem('invite-music', wantMusic ? 'on' : 'off'); } catch (e) {}
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (!music.paused) { music.pause(); music.dataset.resume = '1'; }
    } else if (music.dataset.resume) {
      delete music.dataset.resume;
      music.play().catch(() => setPlaying(false));
    }
  });
  // Only show the button (and the credit) once the music file is actually there
  fetch(MUSIC.src, { method: 'HEAD' }).then(r => {
    if (!r.ok) return;
    music.src = `${MUSIC.src}#t=${MUSIC.start}`;     // media fragment: start playback at MUSIC.start
    soundBtn.hidden = false;
    if (wantMusic) {
      soundBtn.classList.add('invite');
      firstTapEvents.forEach(t => document.addEventListener(t, onFirstTap, true));
    }
    const credit = document.querySelector('.credit');
    credit.textContent = MUSIC.credit;
    credit.href = MUSIC.creditUrl;
    credit.hidden = false;
    credit.closest('.slide').classList.add('has-credit');
  }).catch(() => {});

  /* Opening page: fade the logo in once loaded; tap it to move on */
  const intro = slides[0];
  const logo = intro.querySelector('.logo');
  const showLogo = () => logo.classList.add('in');
  if (logo.complete && logo.naturalWidth) setTimeout(showLogo, 60);
  else logo.addEventListener('load', showLogo);
  intro.addEventListener('click', () => go(1));
  ready = true;
  setTimeout(() => { if (current === 0) hint.classList.remove('away'); }, reduced ? 0 : 1600);
  setTimeout(startPetals, reduced ? 0 : 600);

  /* Petals */
  function startPetals() {
    if (reduced) return;
    const cv = document.querySelector('.petals');
    const ctx = cv.getContext('2d');
    if (!ctx) return;
    const colors = ['#e94b7d', '#f2a23a', '#f6ecd8', '#d8325a', '#ffcf73'];
    const rnd = (a, b) => a + Math.random() * (b - a);
    let W = 0, H = 0, ps = [], last = 0, raf = 0;
    const make = (p, fromTop) => Object.assign(p, {
      x: rnd(0, W), y: fromTop ? rnd(-60, -12) : rnd(-20, H),
      s: rnd(4, 8.5), vy: rnd(.3, .75),
      sw: rnd(0, 6.28), sws: rnd(.008, .018), swa: rnd(.25, .8),
      r: rnd(0, 6.28), vr: rnd(-.025, .025), f: rnd(0, 6.28), vf: rnd(.02, .05),
      c: colors[Math.random() * colors.length | 0], a: rnd(.5, .85),
    });
    const size = () => {
      const d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d;
      ctx.setTransform(d, 0, 0, d, 0, 0);
      const n = W < 700 ? 14 : 24;
      while (ps.length < n) ps.push(make({}, false));
      ps.length = n;
    };
    const tick = t => {
      const k = last ? Math.min((t - last) / 16.67, 3) : 1;
      last = t;
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.sw += p.sws * k; p.x += Math.sin(p.sw) * p.swa * k; p.y += p.vy * k;
        p.r += p.vr * k; p.f += p.vf * k;
        if (p.y > H + 20) make(p, true);
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.scale(1, .35 + .65 * Math.abs(Math.cos(p.f)));
        ctx.globalAlpha = p.a;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .7, p.s * .7, 0, p.s);
        ctx.bezierCurveTo(-p.s * .7, p.s * .7, -p.s * .9, -p.s * .6, 0, -p.s);
        ctx.fill();
        ctx.restore();
      }
      raf = requestAnimationFrame(tick);
    };
    size();
    addEventListener('resize', size);
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(raf);
      last = 0;
      if (!document.hidden) raf = requestAnimationFrame(tick);
    });
    raf = requestAnimationFrame(tick);
    cv.classList.add('on');
  }
})();
</script>
</body>
</html>
