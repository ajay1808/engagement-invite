<script>
  document.documentElement.classList.add('js');
  // If a file is missing, try the next name in data-fallback (e.g. 3.PNG → 3.png → 3.jpg …)
  function nextSrc(img) {
    var list = (img.dataset.fallback || '').split(/\s+/).filter(Boolean);
    if (!list.length) return;
    img.dataset.fallback = list.slice(1).join(' ');
    img.src = list[0];
  }
</script>

<style>
  :root {
    --maroon-900: #170404;
    --maroon-800: #2a0707;
    --maroon-700: #4a0e0e;
    --gold: #e3c27e;
    --gold-soft: rgba(227, 194, 126, .34);
    --ivory: #f8eedc;
    --side: 14px;
    --pad-top: 44px;
    --pad-bottom: 104px;
    --radius: 12px;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    color-scheme: dark;
  }
  /* Wide screens (desktop, landscape tablets): room at the sides for the page dots */
  @media (min-aspect-ratio: 19/20) {
    :root { --side: 80px; --pad-top: 30px; --pad-bottom: 70px; --radius: 14px; }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--maroon-900); color: var(--ivory); }
  body {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, a { touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ───── Scrolling deck ───── */
  .deck {
    position: relative;
    height: 100vh;
    height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: none;
    scrollbar-width: none;
    outline: none;
  }
  .deck::-webkit-scrollbar { display: none; }

  .slide {
    position: relative;
    height: 100%;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding:
      calc(var(--pad-top) + env(safe-area-inset-top)) var(--side)
      calc(var(--pad-bottom) + env(safe-area-inset-bottom));
  }

  /* Soft, blurred copy of the page's own artwork fills the space around it */
  .ambient {
    position: absolute;
    inset: -12%;
    z-index: 0;
    background-color: var(--maroon-800);
    background-image: var(--bg, none);
    background-position: center;
    background-size: cover;
    filter: blur(38px) saturate(1.3) brightness(.68);
    transform: translateZ(0);
  }
  .slide::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(120% 85% at 50% 45%, transparent 30%, rgba(18, 3, 3, .6) 100%);
  }

  /* The framed artwork. --ar is set from the real image size, so any replacement fits. */
  .frame {
    --ar: .8;
    --extra: 0px;
    position: relative;
    z-index: 2;
    flex: none;
    margin: 0;
    aspect-ratio: var(--ar);
    width: min(100%, calc((100vh - var(--pad-top) - var(--pad-bottom) - var(--extra)) * var(--ar)));
    width: min(100%, calc((100dvh - var(--pad-top) - var(--pad-bottom) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - var(--extra)) * var(--ar)));
    border-radius: var(--radius);
    outline: 1px solid var(--gold-soft);
    outline-offset: 6px;
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .85), 0 14px 32px -14px rgba(0, 0, 0, .6);
  }
  .slide.has-actions .frame { --extra: 64px; }
  .media {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: inherit;
    background: var(--maroon-800);
    transform: translateZ(0);
  }
  .media::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 230, 180, .2);
  }
  .media img, .media video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-select: none;
  }
  .slide:first-child .media img {
    transform-origin: 50% 62%;
    animation: drift 22s ease-in-out infinite alternate;
  }

  /* Entrance: each page rises in the first time it's seen */
  .js .frame { opacity: 0; transform: translateY(28px) scale(.98); transition: opacity 1.1s ease, transform 1.4s var(--ease-out); }
  .js .slide.seen .frame { opacity: 1; transform: none; }

  /* ───── Video controls ───── */
  .chip {
    position: absolute;
    z-index: 3;
    right: 12px;
    bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 15px 9px 12px;
    border-radius: 99px;
    border: 1px solid rgba(255, 230, 180, .35);
    background: rgba(30, 6, 6, .45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--ivory);
    font: 600 13px/1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    animation: rise .6s var(--ease-out);
  }
  .chip svg { width: 15px; height: 15px; color: var(--gold); }
  .play {
    position: absolute;
    z-index: 3;
    inset: 0;
    margin: auto;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 1px solid rgba(255, 230, 180, .5);
    background: rgba(30, 6, 6, .4);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--ivory);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .play svg { width: 26px; height: 26px; margin-left: 4px; }

  /* ───── Optional buttons under the last page ───── */
  .actions {
    position: relative;
    z-index: 2;
    flex: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .js .actions { opacity: 0; transform: translateY(12px); transition: opacity .9s ease .35s, transform 1s var(--ease-out) .35s; }
  .js .slide.seen .actions { opacity: 1; transform: none; }
  .actions a {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 46px;
    padding: 0 22px 0 18px;
    border-radius: 99px;
    border: 1px solid rgba(227, 194, 126, .55);
    background: rgba(28, 5, 5, .42);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: var(--ivory);
    text-decoration: none;
    font: 600 15px/1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .1em;
    text-transform: uppercase;
    transition: background .3s, border-color .3s, transform .2s;
  }
  .actions a:hover { background: rgba(227, 194, 126, .16); border-color: var(--gold); }
  .actions a:active { transform: scale(.97); }
  .actions svg { width: 17px; height: 17px; color: var(--gold); flex: none; }

  /* ───── Falling petals (between the blurred backdrop and the artwork) ───── */
  .petals {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  .petals.on { opacity: 1; }

  /* ───── Page dots + scroll hint ───── */
  .dots {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
  }
  .dots button {
    appearance: none;
    border: 0;
    background: none;
    padding: 10px 5px;
    cursor: pointer;
  }
  .dots button::before {
    content: "";
    display: block;
    width: 7px;
    height: 7px;
    border-radius: 99px;
    background: rgba(248, 238, 220, .4);
    transition: width .5s var(--ease-out), height .5s var(--ease-out), background .5s;
  }
  .dots button:hover::before { background: rgba(248, 238, 220, .75); }
  .dots button[aria-current="true"]::before { width: 24px; background: var(--gold); }

  .hint {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(52px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 14px 6px calc(14px + .34em);
    border: 0;
    background: none;
    color: var(--ivory);
    font: 600 12px/1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .34em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: .9;
    transition: opacity .6s ease, transform .6s var(--ease-out);
  }
  .hint svg { width: 18px; height: 18px; color: var(--gold); animation: nudge 2.2s ease-in-out infinite; }
  .hint.away { opacity: 0; pointer-events: none; transform: translate(-50%, 8px); }

  @media (min-aspect-ratio: 19/20) {
    .dots {
      left: auto;
      right: calc(28px + env(safe-area-inset-right));
      top: 50%;
      bottom: auto;
      transform: translateY(-50%);
      flex-direction: column;
    }
    .dots button { padding: 5px 10px; }
    .dots button[aria-current="true"]::before { width: 7px; height: 24px; }
    .hint { bottom: calc(12px + env(safe-area-inset-bottom)); }
  }

  /* ───── Opening curtain ───── */
  .curtain { display: none; }
  .js .curtain {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% 42%, var(--maroon-700) 0%, var(--maroon-800) 55%, var(--maroon-900) 100%);
    transition: opacity 1.1s ease, visibility 1.1s;
  }
  .curtain.lift { opacity: 0; visibility: hidden; }
  .curtain-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: transform 1.3s var(--ease-out);
  }
  .curtain.lift .curtain-inner { transform: scale(1.06) translateY(-10px); }
  .rings { width: 104px; height: auto; color: var(--gold); overflow: visible; }
  .rings .d { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.6s cubic-bezier(.65, 0, .35, 1) forwards; }
  .rings .d2 { animation-delay: .2s; }
  .rings .d3 { animation-delay: .75s; animation-duration: .9s; }
  .rings .spark { opacity: 0; animation: twinkle 1.6s ease 1.3s infinite; }
  .rings .spark2 { animation-delay: 1.7s; }
  .curtain-title {
    margin: 0;
    font: italic 500 31px/1.1 'Cormorant Garamond', Georgia, serif;
    letter-spacing: .02em;
    opacity: 0;
    animation: rise 1.1s var(--ease-out) .75s forwards;
  }
  .curtain-line {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: grow 1.3s var(--ease-out) 1s forwards;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { to { width: 132px; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes nudge { 0%, 100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(5px); opacity: 1; } }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .25s !important; }
    .slide:first-child .media img { animation: none; }
    .js .frame, .js .actions { transform: none; }
  }
</style>
</head>
<body>

<div class="curtain" aria-hidden="true">
  <div class="curtain-inner">
    <svg class="rings" viewBox="0 0 120 92" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle class="d" style="--len:152" cx="46" cy="60" r="24"/>
      <circle class="d d2" style="--len:152" cx="74" cy="60" r="24"/>
      <path class="d d3" style="--len:60" d="M66 30l4-6h8l4 6-8 8z M66 30h16 M70 24l2 6 2 8 2-8 2-6"/>
      <path class="spark" style="transform-origin:97px 22px" d="M97 16v12M91 22h12"/>
      <path class="spark spark2" style="transform-origin:24px 32px" d="M24 28v8M20 32h8"/>
    </svg>
    <p class="curtain-title">You're invited</p>
    <span class="curtain-line"></span>
  </div>
</div>

<main class="deck" id="deck" tabindex="-1">

  <!-- Page 1 -->
  <section class="slide" aria-label="Invitation, page 1 of 3">
    <div class="ambient" style="--bg:url('1.jpg')"></div>
    <figure class="frame">
      <div class="media">
        <img src="1.jpg" data-fallback="1.png 1.PNG 1.jpeg 1.JPG" onerror="nextSrc(this)"
             alt="Invitation cover: a painting of a festive home corner with a red post box, brass vessels and a rocking chair"
             fetchpriority="high" draggable="false">
      </div>
    </figure>
  </section>

  <!-- Page 2 (video) -->
  <section class="slide" aria-label="Invitation, page 2 of 3">
    <div class="ambient" style="--bg:url('2-poster.jpg')"></div>
    <figure class="frame">
      <div class="media">
        <video src="2.mp4" poster="2-poster.jpg" muted playsinline preload="none"
               disablepictureinpicture disableremoteplayback
               aria-label="Animated painting: a ring being placed on a finger, reflected in a golden mirror"></video>
      </div>
      <button class="chip replay" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Replay
      </button>
      <button class="play" type="button" aria-label="Play" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      </button>
    </figure>
  </section>

  <!-- Page 3 (event details) — just replace 3.PNG to update this page -->
  <section class="slide" aria-label="Invitation, page 3 of 3">
    <div class="ambient"></div>
    <figure class="frame">
      <div class="media">
        <img src="3.PNG" data-fallback="3.png 3.jpg 3.jpeg 3.JPG 3.JPEG 3.webp 3.WEBP" onerror="nextSrc(this)"
             alt="Engagement details" fetchpriority="low" draggable="false">
      </div>
    </figure>
    <div class="actions" hidden></div>
  </section>

</main>

<canvas class="petals" aria-hidden="true"></canvas>

<nav class="dots" aria-label="Pages">
  <button type="button" aria-label="Page 1" aria-current="true"></button>
  <button type="button" aria-label="Page 2"></button>
  <button type="button" aria-label="Page 3"></button>
</nav>

<button class="hint away" type="button" aria-label="Next page">
  Scroll
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>

<script>
/* ─────────────────────────────────────────────────────────────
   OPTIONAL: buttons shown under the last page.
   Paste a link into "url" to show that button; leave it '' to hide it.
   ───────────────────────────────────────────────────────────── */
const BUTTONS = [
  { label: 'Directions', icon: 'pin',  url: '' },  // e.g. a Google Maps share link
  { label: 'RSVP',       icon: 'chat', url: '' },  // e.g. https://wa.me/91XXXXXXXXXX?text=Count%20me%20in!
];

(() => {
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll('.slide')];
  const dots = [...document.querySelectorAll('.dots button')];
  const hint = document.querySelector('.hint');
  const curtain = document.querySelector('.curtain');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current = 0;
  let ready = false;

  /* Fit each frame to the real shape of its image, and use it for the blurred backdrop */
  const fit = img => {
    if (!img.naturalWidth) return;
    img.closest('.frame').style.setProperty('--ar', img.naturalWidth / img.naturalHeight);
    const src = (img.currentSrc || img.src).replace(/'/g, '%27');
    img.closest('.slide').querySelector('.ambient').style.setProperty('--bg', `url('${src}')`);
  };
  document.querySelectorAll('.media img').forEach(img => {
    if (img.complete) fit(img);
    img.addEventListener('load', () => fit(img));
  });

  /* Optional buttons */
  const ICONS = {
    pin:  '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    chat: '<path d="M4 19.5l1.3-3.9A8 8 0 1 1 8.4 18.7z"/>',
    link: '<path d="M7 17L17 7M9 7h8v8"/>',
  };
  const actions = document.querySelector('.actions');
  BUTTONS.filter(b => b.url).forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[b.icon] || ICONS.link}</svg>`;
    a.append(b.label);
    actions.append(a);
  });
  if (actions.children.length) {
    actions.hidden = false;
    actions.closest('.slide').classList.add('has-actions');
  }

  /* Video: plays when its page is in view, holds on the last frame, replays on return */
  const video = deck.querySelector('video');
  const replayBtn = deck.querySelector('.replay');
  const playBtn = deck.querySelector('.play');
  video.muted = true;
  const playFromStart = () => {
    replayBtn.hidden = true;
    playBtn.hidden = true;
    try { video.currentTime = 0; } catch (e) {}
    const p = video.play();
    if (p) p.catch(() => { if (video.paused) playBtn.hidden = false; });
  };
  video.addEventListener('ended', () => { replayBtn.hidden = false; });
  replayBtn.addEventListener('click', playFromStart);
  playBtn.addEventListener('click', playFromStart);
  video.addEventListener('click', () => { if (video.ended || video.paused) playFromStart(); });
  const videoIndex = slides.findIndex(s => s.contains(video));

  /* Page tracking */
  const setActive = i => {
    current = i;
    dots.forEach((d, j) => d.setAttribute('aria-current', j === i ? 'true' : 'false'));
    hint.classList.toggle('away', i === slides.length - 1);
    slides[i].classList.add('seen');
    if (i === videoIndex) playFromStart();
    else if (!video.paused) video.pause();
  };
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const i = slides.indexOf(e.target);
      if (e.isIntersecting && e.intersectionRatio >= .6 && ready && i !== current) setActive(i);
    });
  }, { root: deck, threshold: .6 });
  slides.forEach(s => io.observe(s));

  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    deck.scrollTo({ top: slides[i].offsetTop, behavior: reduced ? 'auto' : 'smooth' });
  }
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  hint.addEventListener('click', () => go(current + 1));

  /* Mouse wheel / trackpad: one gesture = one page (touch scrolling stays native) */
  let wheelLock = false, wheelTimer = 0;
  deck.addEventListener('wheel', e => {
    if (e.ctrlKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { wheelLock = false; }, 200);
    if (wheelLock || !ready) return;
    wheelLock = true;
    go(current + Math.sign(e.deltaY));
  }, { passive: false });
  addEventListener('keydown', e => {
    if (!ready || e.altKey || e.ctrlKey || e.metaKey) return;
    const onButton = e.target.closest && e.target.closest('button, a');
    if (['ArrowDown', 'PageDown', 'j'].includes(e.key) || (e.key === ' ' && !onButton && !e.shiftKey)) go(current + 1);
    else if (['ArrowUp', 'PageUp', 'k'].includes(e.key) || (e.key === ' ' && !onButton && e.shiftKey)) go(current - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(slides.length - 1);
    else return;
    e.preventDefault();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) video.pause();
    else if (current === videoIndex && !video.ended && video.currentTime > 0) video.play().catch(() => {});
  });

  /* Opening: show the curtain until page 1 is ready, then reveal */
  const first = slides[0].querySelector('img');
  const firstReady = new Promise(res => {
    if (first.complete && first.naturalWidth) return res();
    first.addEventListener('load', res, { once: true });
  }).then(() => first.decode ? first.decode().catch(() => {}) : 0);
  Promise.all([
    new Promise(res => setTimeout(res, reduced ? 300 : 1900)),
    Promise.race([firstReady, new Promise(res => setTimeout(res, 6000))]),
  ]).then(() => {
    curtain.classList.add('lift');
    video.preload = 'auto';
    video.load();
    setTimeout(() => {
      ready = true;
      setActive(Math.round(deck.scrollTop / deck.clientHeight) || 0);
      startPetals();
    }, 250);
    setTimeout(() => curtain.remove(), 1500);
  });

  /* Petals */
  function startPetals() {
    if (reduced) return;
    const cv = document.querySelector('.petals');
    const ctx = cv.getContext('2d');
    if (!ctx) return;
    const colors = ['#e94b7d', '#f2a23a', '#f6ecd8', '#d8325a', '#ffcf73'];
    const rnd = (a, b) => a + Math.random() * (b - a);
    let W = 0, H = 0, ps = [], last = 0, raf = 0;
    const make = (p, fromTop) => Object.assign(p, {
      x: rnd(0, W), y: fromTop ? rnd(-60, -12) : rnd(-20, H),
      s: rnd(4, 8.5), vy: rnd(.3, .75),
      sw: rnd(0, 6.28), sws: rnd(.008, .018), swa: rnd(.25, .8),
      r: rnd(0, 6.28), vr: rnd(-.025, .025), f: rnd(0, 6.28), vf: rnd(.02, .05),
      c: colors[Math.random() * colors.length | 0], a: rnd(.5, .85),
    });
    const size = () => {
      const d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d;
      ctx.setTransform(d, 0, 0, d, 0, 0);
      const n = W < 700 ? 14 : 24;
      while (ps.length < n) ps.push(make({}, false));
      ps.length = n;
    };
    const tick = t => {
      const k = last ? Math.min((t - last) / 16.67, 3) : 1;
      last = t;
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.sw += p.sws * k; p.x += Math.sin(p.sw) * p.swa * k; p.y += p.vy * k;
        p.r += p.vr * k; p.f += p.vf * k;
        if (p.y > H + 20) make(p, true);
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.scale(1, .35 + .65 * Math.abs(Math.cos(p.f)));
        ctx.globalAlpha = p.a;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .7, p.s * .7, 0, p.s);
        ctx.bezierCurveTo(-p.s * .7, p.s * .7, -p.s * .9, -p.s * .6, 0, -p.s);
        ctx.fill();
        ctx.restore();
      }
      raf = requestAnimationFrame(tick);
    };
    size();
    addEventListener('resize', size);
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(raf);
      last = 0;
      if (!document.hidden) raf = requestAnimationFrame(tick);
    });
    raf = requestAnimationFrame(tick);
    cv.classList.add('on');
  }
})();
</script>
</body>
</html>
